# Parámetros reutilizables de ruta y de query.
components:
  parameters:
    # ---------- Ruta ----------
    UserId:
      name: uid
      in: path
      required: true
      description: '`_id` del usuario. Un id con formato inválido responde `404 USER_NOT_FOUND`.'
      schema:
        $ref: '#/components/schemas/ObjectId'

    OrderId:
      name: oid
      in: path
      required: true
      description: '`_id` del pedido. Un id con formato inválido responde `404 ORDER_NOT_FOUND`.'
      schema:
        $ref: '#/components/schemas/ObjectId'

    DeliveryId:
      name: did
      in: path
      required: true
      description: '`_id` de la entrega. Un id con formato inválido responde `404 DELIVERY_NOT_FOUND`.'
      schema:
        $ref: '#/components/schemas/ObjectId'

    ProductId:
      name: pid
      in: path
      required: true
      description: '`_id` del producto. Un id con formato inválido responde `404 PRODUCT_NOT_FOUND`.'
      schema:
        $ref: '#/components/schemas/ObjectId'

    # ---------- Paginación ----------
    Page:
      name: page
      in: query
      required: false
      description: Número de página. Un valor que no sea un entero positivo se reemplaza por 1 (no da error).
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      required: false
      description: >-
        Elementos por página. Un valor que no sea un entero positivo se reemplaza por 10 y uno mayor a 100
        se limita a 100 (no da error).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    # ---------- Mocks ----------
    # Se declaran como enteros sin minimum/maximum para poder probar desde Swagger UI
    # los errores de cantidad negativa o fuera de rango.
    MockQty:
      name: qty
      in: query
      required: false
      description: >-
        Cantidad a generar: entero entre 1 y 100. Si no se envía, se usan 10.
        No entero → `MOCK_INVALID_QUANTITY`; negativo → `MOCK_NEGATIVE_QUANTITY`; 0 o más de 100 → `MOCK_QUANTITY_OUT_OF_RANGE`.
      schema:
        type: integer
        default: 10
      example: 5

    MockRole:
      name: role
      in: query
      required: false
      description: >-
        Rol de los usuarios generados: `ADMIN`, `USER` o `COURIER` (acepta minúsculas). Si no se envía,
        cada usuario sale al azar entre `USER` y `COURIER`. Otro valor → `INVALID_ROLE`.
      schema:
        type: string
