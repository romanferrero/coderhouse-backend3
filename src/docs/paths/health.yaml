paths:
  /api/health:
    get:
      tags: [Health]
      summary: Estado de la API (health check)
      description: >-
        Pensado para monitoreo (el `HEALTHCHECK` del contenedor Docker, un balanceador o un servicio de uptime).
        Informa el estado de la API, el entorno, cuántos segundos lleva corriendo, la hora del servidor y si la
        conexión con MongoDB está activa. **No expone información sensible**: ni versiones, ni host o URI de la
        base, ni variables de entorno. Responde `503` si la API perdió la conexión con MongoDB.
        Es el único endpoint que no usa el formato `{ status, payload }`.
      operationId: health
      responses:
        '200':
          description: La API está levantada y conectada a MongoDB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                environment: production
                uptime: 3605
                timestamp: '2026-11-19T15:04:05.123Z'
                database: connected
        '503':
          description: La API responde pero no tiene conexión con MongoDB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: error
                environment: production
                uptime: 3605
                timestamp: '2026-11-19T15:04:05.123Z'
                database: disconnected
